name: "Build and Publish"

on:
  push:
    branches:
      - "main"
    paths-ignore:
      - "**.md"
      - ".github/workflows/ci.yaml"
      - "renovate.json5"
  schedule:
    # Always run at least once a month to regularly rebuild the image .
    - cron: "0 0 1 * *"
  workflow_dispatch:

env:
  REGISTRY: "ghcr.io"
  IMAGE_NAME: "djmattyg007/jsonnet"

jobs:
  main:
    runs-on: "ubuntu-latest"
    permissions:
      contents: "read"
      packages: "write"

    steps:
      - name: "Checkout repository"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1

      - name: "Set up QEMU"
        uses: "docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8" # v4.2.0

      - name: "Set up Docker Buildkit"
        uses: "docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c" # v4.2.0

      - name: "Log in to the container registry"
        uses: "docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7" # v4.5.1
        with:
          registry: "${{ env.REGISTRY }}"
          username: "${{ github.repository_owner }}"
          password: "${{ secrets.GITHUB_TOKEN }}"

      - name: "Get version for image tag"
        id: "get-version"
        run: |
          echo "version=$(grep -m1 'JSONNET_VERSION' < Dockerfile | awk -F "\"" '{print $2}')" >> "${GITHUB_OUTPUT}"
        shell: "bash"

      - name: "Extract metadata (tags, labels) for Docker"
        id: "meta"
        uses: "docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302" # v6.2.0
        with:
          images: "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          tags: |
            type=semver,pattern={{version}},value=${{ steps.get-version.outputs.version }}

      - name: "Build and push image"
        uses: "docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a" # v7.3.0
        with:
          context: "."
          push: true
          tags: "${{ steps.meta.outputs.tags }}"
          labels: "${{ steps.meta.outputs.labels }}"
          platforms: "linux/amd64,linux/arm64,linux/arm/v7"
