name: "Build and Publish"

on:
  push:
    branches:
      - "main"
    paths-ignore:
      - "**.md"
      - ".github/workflows/ci.yaml"
      - "renovate.json5"
  schedule:
    # Always run at least once a month to regularly rebuild the image .
    - cron: "0 0 1 * *"
  workflow_dispatch:

env:
  REGISTRY: "ghcr.io"
  IMAGE_NAME: "djmattyg007/jsonnet"

jobs:
  main:
    runs-on: "ubuntu-latest"
    permissions:
      contents: "read"
      packages: "write"

    steps:
      - name: "Checkout repository"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1

      - name: "Set up QEMU"
        uses: "docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1" # v4.4.0

      - name: "Set up Docker Buildkit"
        uses: "docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069" # v4.4.1

      - name: "Log in to the container registry"
        uses: "docker/login-action@dbcb813823bdd20940b903addbd779551569679f" # v4.6.0
        with:
          registry: "${{ env.REGISTRY }}"
          username: "${{ github.repository_owner }}"
          password: "${{ secrets.GITHUB_TOKEN }}"

      - name: "Get version for image tag"
        id: "get-version"
        run: |
          echo "version=$(grep -m1 'JSONNET_VERSION' < Dockerfile | awk -F "\"" '{print $2}')" >> "${GITHUB_OUTPUT}"
        shell: "bash"

      - name: "Extract metadata (tags, labels) for Docker"
        id: "meta"
        uses: "docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302" # v6.2.0
        with:
          images: "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          tags: |
            type=semver,pattern={{version}},value=${{ steps.get-version.outputs.version }}

      - name: "Build and push image"
        uses: "docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc" # v7.4.0
        with:
          context: "."
          push: true
          tags: "${{ steps.meta.outputs.tags }}"
          labels: "${{ steps.meta.outputs.labels }}"
          platforms: "linux/amd64,linux/arm64,linux/arm/v7"
